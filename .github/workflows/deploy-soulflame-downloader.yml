name: Deploy SoulFlame Downloader to Vercel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger existing Vercel Deploy Hook safely
        shell: bash
        run: |
          set -euo pipefail
          HOOK_URL="$(git show f6023df2eb6e2ea7c5e77147e3ba0d8bbc46a9f5:autopush.bat | tr -d '\r' | sed -n 's/^set "HOOK_URL=\(.*\)"$/\1/p')"
          test -n "$HOOK_URL"
          echo "::add-mask::$HOOK_URL"
          RESPONSE="$(curl --fail --silent --show-error -X POST "$HOOK_URL")"
          echo "VERCEL_HOOK_RESPONSE=$RESPONSE"
